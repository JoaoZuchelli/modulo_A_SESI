
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Paint</title>
    <style>
        body {
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        canvas{
            border: 2px solid black;
            cursor: crosshair;
        }
    </style>
</head>
<body>
    <h1> Mini Paint</h1>
    <input type= "color" id="cor">
    <button id="limpar"> Limpar</button>
    <button id="exportar"> exportar</button>
    <br>
    <br>
    <canvas id="tela" width="600" height="400"></canvas>

    <script>
const tela = document.getElementById("tela");
const ctx = tela.getContext("2d");

        let desenhando = false;

tela.onmousedown = () => desenhando = true;
tela.onmouseup = () => desenhando = false;

tela.onmousemove = e => {
    if (!desenhando) return;

ctx.strokeStyle = cor.value;
ctx.lineTo(e.offsetX, e.offsetY);
ctx.stroke();
            }

limpar.onclick = () =>
    ctx.clearRect(0, 0, tela.width, tela.height);

function exportar() {
    const link = document.createElement("a");
    link.download = "desenho.png";
    link.href = tela.linkUrl("image/png");
    link.click();
}
</script>

    </script>
</body>
</html>

<script>
    //Desafio: Criar funçao para exportar e corrigir limpar completamente

limpar.onclick = () => {
ctx.clearRect(0, 0, tela.width, tela.height);
ctx.beginPath();
    };


    
    </script>
